included:
  - Spelum
  - SpelumTests

excluded:
  - .build
  - DerivedData

opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - redundant_nil_coalescing

line_length:
  warning: 120
  error: 140
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - x
    - y

function_body_length:
  warning: 60
  error: 100

reporter: xcode
